<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="she_m_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>she_m_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    (() => {
      const viewport = window.visualViewport;
      const currentHeight = () =>
        Math.min(window.innerHeight, viewport?.height ?? window.innerHeight);

      let previousHeight = currentHeight();
      let smallestHeight = previousHeight;
      let largestHeight = previousHeight;
      let keyboardWasOpen = false;
      let lastTextInputTapAt = 0;

      document.addEventListener('pointerdown', (event) => {
        const tappedTextInput = event.composedPath().some(
          (target) =>
            target instanceof HTMLElement &&
            target.matches('input, textarea, [contenteditable="true"]'),
        );
        if (tappedTextInput) lastTextInputTapAt = Date.now();
      }, true);

      const handleViewportResize = () => {
        const height = currentHeight();
        if (height < previousHeight) {
          smallestHeight = Math.min(smallestHeight, height);
          keyboardWasOpen = largestHeight - smallestHeight > 120;
        } else if (
          keyboardWasOpen &&
          height - smallestHeight > 80
        ) {
          const activeElement = document.activeElement;
          const tappedTextInputRecently =
            Date.now() - lastTextInputTapAt < 900;
          if (!tappedTextInputRecently &&
              activeElement instanceof HTMLElement &&
              activeElement.matches('input, textarea, [contenteditable="true"]')) {
            activeElement.blur();
          }
          window.dispatchEvent(new Event('resize'));
          smallestHeight = height;
          largestHeight = height;
          keyboardWasOpen = false;
        } else if (!keyboardWasOpen) {
          largestHeight = Math.max(largestHeight, height);
          smallestHeight = height;
        }
        previousHeight = height;
      };

      viewport?.addEventListener('resize', handleViewportResize);
      window.addEventListener('resize', handleViewportResize);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
